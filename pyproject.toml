[project]
name = "dong"
version = "0.1.0"
description = "A minimal CLI coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.38.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[tool.uv]
package = true

[project.scripts]
dong = "dong.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
