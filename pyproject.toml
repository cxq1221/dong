[project]
name = "dong"
version = "0.1.0"
description = "A minimal CLI coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.104.1",
    "openai>=2.38.0",
    "playwright>=1.60.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["dong"]
artifacts = ["dong/default_agent_define.md"]

[project.scripts]
dong = "dong.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.uv.sources]
